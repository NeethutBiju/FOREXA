<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOREXA — Forecast Intelligence | Hybrid AI–NWP Early Warning Platform for Kerala</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet 1.9.4 for Real Interactive OpenStreetMap & Kerala GeoJSON Polygons -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <style>
      :root {
        --forexa-primary: #6D28D9;
        --forexa-deep: #4C1D95;
        --forexa-tint: #EDE9FE;
        --forexa-bg: #F5F3FF;
        --forexa-text: #1F1535;
      }
      body {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #F5F3FF;
        color: #1F1535;
      }
      @keyframes pulseRedGlow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.45);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(220, 38, 38, 0);
        }
      }
      @keyframes purpleFlash {
        0% {
          box-shadow: 0 0 0 0 rgba(109, 40, 217, 0.45);
        }
        100% {
          box-shadow: 0 0 0 10px rgba(109, 40, 217, 0);
        }
      }
      @keyframes mapRedStrokePulse {
        0%, 100% {
          stroke-opacity: 1;
          stroke-width: 3.5px;
        }
        50% {
          stroke-opacity: 0.45;
          stroke-width: 6px;
        }
      }
      .animate-red-severity {
        animation: pulseRedGlow 2s infinite ease-in-out;
      }
      .animate-purple-flash {
        animation: purpleFlash 0.65s ease-out;
      }
      .leaflet-interactive.kerala-red-pulse {
        animation: mapRedStrokePulse 1.8s infinite ease-in-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-red-severity,
        .animate-purple-flash,
        .leaflet-interactive.kerala-red-pulse {
          animation: none !important;
        }
      }
      /* Custom thin scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F5F3FF;
      }
      ::-webkit-scrollbar-thumb {
        background: #C4B5FD;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #7C3AED;
      }
      .leaflet-container {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif !important;
        background: #EDE9FE !important;
      }
      .kerala-map-tooltip {
        background: rgba(31, 21, 53, 0.95) !important;
        border: 1px solid #8B5CF6 !important;
        border-radius: 10px !important;
        color: #FFFFFF !important;
        padding: 8px 12px !important;
        box-shadow: 0 10px 25px rgba(76, 29, 149, 0.35) !important;
      }
      .kerala-map-tooltip::before {
        border-top-color: rgba(31, 21, 53, 0.95) !important;
      }
    </style>
  </head>
  <body class="bg-[#F5F3FF] text-[#1F1535] antialiased selection:bg-[#6D28D9] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
