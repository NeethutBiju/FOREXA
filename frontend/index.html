<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14532D" />
    <link rel="manifest" href="/manifest.json" />
    <title>FOREXA — Forecast Intelligence | Hybrid AI–NWP Early Warning Platform for Kerala</title>
    <!-- Google Analytics 4 (Connected to Firebase Measurement ID G-LXDM92KRZ6) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LXDM92KRZ6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LXDM92KRZ6');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet 1.9.4 for Real Interactive OpenStreetMap & Kerala GeoJSON Polygons -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <style>
      :root {
        --forexa-primary: #14532D;
        --forexa-deep: #052E16;
        --forexa-tint: #ECFDF5;
        --forexa-bg: #F4F9F6;
        --forexa-text: #0F172A;
      }
      body {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #F4F9F6;
        color: #0F172A;
      }
      @keyframes pulseRedGlow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.45);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(220, 38, 38, 0);
        }
      }
      @keyframes purpleFlash {
        0% {
          box-shadow: 0 0 0 0 rgba(20, 83, 45, 0.35);
        }
        100% {
          box-shadow: 0 0 0 10px rgba(20, 83, 45, 0);
        }
      }
      @keyframes mapRedStrokePulse {
        0%, 100% {
          stroke-opacity: 1;
          stroke-width: 3.5px;
        }
        50% {
          stroke-opacity: 0.45;
          stroke-width: 6px;
        }
      }
      .animate-red-severity {
        animation: pulseRedGlow 2s infinite ease-in-out;
      }
      .animate-purple-flash {
        animation: purpleFlash 0.65s ease-out;
      }
      .leaflet-interactive.kerala-red-pulse {
        animation: mapRedStrokePulse 1.8s infinite ease-in-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-red-severity,
        .animate-purple-flash,
        .leaflet-interactive.kerala-red-pulse {
          animation: none !important;
        }
      }
      /* Custom thin scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F4F9F6;
      }
      ::-webkit-scrollbar-thumb {
        background: #86EFAC;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #15803D;
      }
      .leaflet-container {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif !important;
        background: #ECFDF5 !important;
      }
      .kerala-map-tooltip {
        background: rgba(5, 46, 22, 0.96) !important;
        border: 1px solid #16A34A !important;
        border-radius: 10px !important;
        color: #FFFFFF !important;
        padding: 8px 12px !important;
        box-shadow: 0 10px 25px rgba(5, 46, 22, 0.32) !important;
      }
      .kerala-map-tooltip::before {
        border-top-color: rgba(5, 46, 22, 0.96) !important;
      }
    </style>
  </head>
  <body class="bg-[#F4F9F6] text-slate-900 antialiased selection:bg-[#14532D] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
